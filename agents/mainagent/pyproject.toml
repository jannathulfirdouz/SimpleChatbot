[project]
name = "mainagent"
version = "1.0.0"
description = "SimpleChatbot main agent powered by Strands Agents and Amazon Bedrock AgentCore"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore",
    "strands-agents",
]

[project.optional-dependencies]
observability = [
    "aws-opentelemetry-distro>=0.10.1",
]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
